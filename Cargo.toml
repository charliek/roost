# Roost Cargo workspace.
#
# Layout:
#   * roost-ipc   — JSON IPC wire format, framing, client + server,
#                   bundle-profile path resolution, target selection.
#   * roost-vt    — libghostty-vt FFI wrapper with optional `--features ffi`.
#   * roost-osc   — OSC scanner that lifts (command, payload) pairs out of
#                   PTY byte streams. Used by the Linux UI and the
#                   roost-osc test fixtures.
#   * roost-agent — pure agent adapters: hook event JSON in,
#                   `tab.agent_report` params out. No I/O.
#   * roost-engine — toolkit-neutral workspace, persistence, PTY runtime,
#                    application commands/events, and IPC dispatch.
#   * roost-ui-model — toolkit-neutral config, theme, palette, keybind,
#                      provider, agent projection, and selection models.
#   * roost-iced — the Linux UI, packaged as `/usr/bin/roost`.
#   * roost-session — the headless host-session daemon; binary is
#                     `roost-session`. Same engine as a UI, no toolkit.
#   * roost-cli   — shell-integration CLI; binary is `roostctl`.
#
# The pre-M7 daemon-era crates (roost-core, roost-proto, roost-common,
# roost-smoke) are gone; `proto/roost.proto` has moved to
# `docs/archive/roost.proto` as historical reference.

[workspace]
resolver = "2"
members = [
    "crates/roost-ipc",
    "crates/roost-vt",
    "crates/roost-osc",
    "crates/roost-url",
    "crates/roost-agent",
    "crates/roost-engine",
    "crates/roost-ui-model",
    "crates/roost-cli",
    "crates/roost-iced",
    "crates/roost-session",
]

[workspace.package]
# Single source of truth for the release version. Tag pushes (`v0.0.2`)
# assert `${tag#v}` matches this in the release workflow; the .deb + .app
# read it via $ROOST_VERSION at packaging time. Bump here before tagging.
version       = "0.0.19"
edition       = "2021"
rust-version  = "1.97"
license       = "MIT"
repository    = "https://github.com/charliek/roost"
publish       = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
needless_collect = "warn"
needless_pass_by_value = "warn"

[workspace.dependencies]
# Async runtime + utilities
tokio        = { version = "1.40", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "sync", "process", "signal", "time", "rt"] }
tokio-stream = { version = "0.1",  features = ["sync"] }
tokio-util   = { version = "0.7",  features = ["compat"] }
futures      = "0.3"
async-stream = "0.3"

# Errors / logging
thiserror = "1.0"
anyhow    = "1.0"
tracing   = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# PTY
portable-pty = "0.8"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# FFI / build
bindgen = "0.70"
cc      = "1.0"

# Hashing (release-asset checksums, roost-ipc's bootstrap download)
sha2      = "0.10"

# Misc
getrandom        = "0.4"
percent-encoding = "2.3"
regex            = { version = "1.10" }
unicode-width    = "0.2"

[profile.release]
lto         = "thin"
codegen-units = 1
strip       = "debuginfo"

[profile.dev]
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
# Vendored swash 0.2.10 carrying the #292 zero-long-metrics guard.
# See third_party/swash/README.roost.md and CLAUDE.md § Library preferences.
swash = { path = "third_party/swash" }
