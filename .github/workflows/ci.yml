      - name: Run bootstrap E2E (Linux Wayland)
        if: runner.os == 'Linux'
        env:
          ICED_BACKEND: ${{ matrix.renderer }}
          RUST_LOG: warn
          ROOST_TEST_MODE: "1"
          ROOST_TEST_TIMEOUT_SCALE: "3"
          ROOST_E2E_ARTIFACT_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-bootstrap-artifacts
          ROOST_E2E_LOG_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-bootstrap-logs
        run: >
          tools/wayland/weston-run.sh
          uv run --group test pytest
          tools/roosttest/test_host_bootstrap.py
