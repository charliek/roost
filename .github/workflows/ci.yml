          ROOST_TEST_MODE: "1"
          ROOST_TEST_TIMEOUT_SCALE: "3"
          ROOST_E2E_ARTIFACT_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-ssh-artifacts
          ROOST_E2E_LOG_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-ssh-logs
