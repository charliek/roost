          ROOST_TEST_MODE: "1"
          ROOST_TEST_TIMEOUT_SCALE: "3"
          ROOST_E2E_ARTIFACT_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-missing-daemon-artifacts
          ROOST_E2E_LOG_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-missing-daemon-logs
        run: >
          tools/wayland/weston-run.sh
          uv run --group test pytest
          tools/roosttest/test_host_local_missing_daemon.py
          --roost-target iced --roost-fresh -v

      # The Wayland twin of the X11 local-spawn step. Same ordering rule,
      # and one more reason for it: this lane owns the runner's default
      # session socket for its duration.
      - name: Run local-spawn E2E (Linux Wayland)
        if: runner.os == 'Linux'
        env:
          ICED_BACKEND: ${{ matrix.renderer }}
          RUST_LOG: warn
          ROOST_TEST_MODE: "1"
          ROOST_TEST_TIMEOUT_SCALE: "3"
          ROOST_E2E_ARTIFACT_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-local-spawn-artifacts
          ROOST_E2E_LOG_DIR: ${{ runner.temp }}/roost-iced-e2e-wayland-host-local-spawn-logs
        run: >
