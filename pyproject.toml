[project]
name = "roost-docs"
version = "0.1.0"
description = "Documentation for the Roost terminal multiplexer"
requires-python = ">=3.12"

[dependency-groups]
docs = [
    "zensical>=0.0.52",
    "stridelabs-docs-theme",
]
test = [
    "pytest>=9.0.3",
    # Per-test hard cap so one hung test (e.g. a Wayland clipboard/render
    # stall) fails fast instead of eating a CI step's whole budget. Opt-in
    # per job via `--timeout=...`; no global default so it can't surprise
    # the existing X11/Mac jobs.
    "pytest-timeout>=2.3.0",
]

# The shared theme is a plain git dependency, not a registry package -- these
# are public repos with public docs builds, so an auth-gated index would break
# PRs from forks. The tag is mutable; uv.lock pins the resolved commit SHA,
# which is why every docs build uses --locked.
[tool.uv.sources]
stridelabs-docs-theme = { git = "https://github.com/charliek/stridelabs-docs-theme", tag = "v0.2.2" }

[tool.pytest.ini_options]
testpaths = ["tools/roosttest"]
addopts = "-ra"
markers = [
    # Drives a `roost-session` daemon it spawns itself, against a throwaway
    # profile — never a UI. conftest's autouse UI fixture stands down when
    # every collected test carries this marker (see `make e2e-session`).
    "session_daemon: headless roost-session E2E; needs no UI",
    # Drives a `roost-session` daemon AND the harness UI at once, over the
    # host-client wire (plan 037). Unlike `session_daemon` it needs a UI, so
    # conftest's autouse fixture still launches one; the marker exists so the
    # lane can be selected on its own (`make e2e-host-client`) and deselected
    # where no session binary is built (see DAEMON_E2E_DESELECT).
    "host_client: HS-2 host-client E2E; needs a UI *and* a roost-session daemon",
]
