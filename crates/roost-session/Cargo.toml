[package]
name          = "roost-session"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
publish       = { workspace = true }
description   = "Headless Roost host session: workspace + PTY supervisor + session IPC socket, no UI"

[[bin]]
name = "roost-session"
path = "src/main.rs"

[dependencies]
# `server-vt` is what makes this a host session rather than a headless
# UI: every tab gets an authoritative server terminal, which is what
# `tab.attach`, headless `tab.dump`, and answered device queries are all
# built on. It pulls roost-vt's `ffi` in, so building this crate needs
# the vendored libghostty-vt archive (`third_party/ghostty/build.sh`).
roost-engine = { path = "../roost-engine", features = ["server-vt"] }
roost-ipc    = { path = "../roost-ipc" }
# For `libghostty_build()` alone — the pin identity `session.identify`
# advertises and `tab.attach` matches against.
roost-vt     = { path = "../roost-vt", features = ["ffi"] }

# `io-std` on top of the workspace set: the client bridge pumps the
# process's own stdin/stdout, which is the one place in the workspace
# that needs tokio's stdio handles.
tokio   = { workspace = true, features = ["io-std"] }
anyhow  = { workspace = true }
clap    = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# `identify` prints `SessionBinaryIdentity` as one JSON line — no other
# op in this crate needs serde_json outside tests, until now.
serde_json = "1"

# fork / setsid / umask / pipe / poll / dup2 — the daemonize sequence
# has no safe-Rust equivalent, and the same crate already backs
# `roost-ipc`'s peer credentials and `roost-engine`'s reaper.
libc = "0.2"

# 128 bits for the session id. Already in the workspace graph (tempfile,
# jobserver); the smallest thing that answers "give me entropy" without
# pulling a generator framework in behind it.
getrandom = { workspace = true }

[dev-dependencies]
tempfile   = "3"

[lints]
workspace = true
