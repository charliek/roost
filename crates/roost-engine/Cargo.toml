[package]
name = "roost-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Toolkit-neutral Roost workspace, PTY runtime, persistence, events, and IPC dispatch"

[features]
# libghostty-vt: what the session tab task and roost-iced's in-process
# tabs both read off a terminal — its ordered status events in the
# composition layer's types (`program_status::drain`) and its memory
# (`memory::of`). The composition layer itself needs no feature.
vt = ["dep:roost-vt", "roost-vt/ffi"]
# Host sessions: the per-tab authoritative server Terminal and its tab
# task (`tab_task.rs`). The feature only makes the code AVAILABLE — a
# workspace build unifies features, so a UI binary can link it. What
# turns the pipeline on is the runtime opt-in
# `PtySupervisor::enable_server_vt`, which only `roost-session` calls.
server-vt = ["vt"]

[dependencies]
roost-ipc = { path = "../roost-ipc" }
roost-osc = { path = "../roost-osc" }
roost-vt = { path = "../roost-vt", optional = true }
# Not optional: host ids and attach tickets are minted here, and neither
# is a server-vt concern — a UI build mints both without serving attach
# data.
getrandom = { workspace = true }

portable-pty = { workspace = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# A macOS tab's default LANG reads the user's NSLocale (issue #697). Same
# objc2 0.6 generation roost-iced pins, so the lock holds one copy.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }

[lints]
workspace = true
