[package]
name = "roost-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Toolkit-neutral Roost workspace, PTY runtime, persistence, events, and IPC dispatch"

[features]
# Experimental Swift-facing boundary (facade.rs). Unconsumed by the Rust
# UIs; gated until a real adapter proves the seam (roadmap M5).
facade = []
# Host sessions: the per-tab authoritative server Terminal and its tab
# task (`tab_task.rs`). The feature only makes the code AVAILABLE — a
# workspace build unifies features, so a UI binary can link it. What
# turns the pipeline on is the runtime opt-in
# `PtySupervisor::enable_server_vt`, which only `roost-session` calls.
server-vt = ["dep:roost-vt", "roost-vt/ffi"]

[dependencies]
roost-ipc = { path = "../roost-ipc" }
roost-osc = { path = "../roost-osc" }
roost-vt = { path = "../roost-vt", optional = true }
# Not optional: `session.connect`'s lease is minted here, and a lease is
# not a server-vt concern — a session hands one out whether or not it
# serves attach data.
getrandom = { workspace = true }

portable-pty = { workspace = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
