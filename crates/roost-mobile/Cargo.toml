[package]
name        = "roost-mobile"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
description = "Roost mobile core: per-tab libghostty terminals driven by attach events, frames for Flutter"

[lints]
workspace = true

[features]
# The frame decoder and row-text helpers, for tests outside this crate.
test-support = []

[dependencies]
roost-client = { path = "../roost-client" }
roost-ipc = { path = "../roost-ipc" }
roost-ssh = { path = "../roost-ssh" }
roost-ui-model = { path = "../roost-ui-model" }
roost-vt = { path = "../roost-vt", features = ["ffi"] }
base64 = "0.22"
futures = { workspace = true }
getrandom = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = "3"
