[package]
name          = "roost-ipc"
version       = { workspace = true }
edition       = { workspace = true }
rust-version  = { workspace = true }
license       = { workspace = true }
repository    = { workspace = true }
publish       = { workspace = true }

[lints]
workspace = true

[dependencies]
# Core serde + JSON for the wire format.
serde       = { version = "1.0", features = ["derive"] }
serde_json  = "1.0"

# Base64 for binary-fidelity byte payloads.
base64      = "0.22"

# The wire's JSON Schema, derived from the serde types above so it
# cannot describe a shape they do not (plan 067 §3.6).
schemars    = { version = "1.2", default-features = false, features = ["derive"] }

# Async + UDS for framing and the (in-process) server/client.
tokio       = { workspace = true }

# Errors.
anyhow      = { workspace = true }
thiserror   = { workspace = true }

# Streaming SHA-256 over a downloaded release asset, before a byte of
# it is streamed to a host (plan 039 §3.6).
sha2        = { workspace = true }

# Logging.
tracing     = { workspace = true }

# Peer credentials (SO_PEERCRED / getpeereid), the runtime-dir mode
# checks, the `/tmp` namespace uid in `paths`, plus `EAGAIN` in the
# socket-liveness errno tests.
libc        = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = "3.10"
# Validates tests/ipc-vectors against the schema bundle. No default
# features: no HTTP or file `$ref` resolution, the bundle is one document.
jsonschema = { version = "0.56", default-features = false }
