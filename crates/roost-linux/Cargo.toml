[package]
name        = "roost-linux"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
description = "Roost Linux UI adapter — gtk4-rs + libadwaita-rs over roost-engine"

# The GTK adapter renders and handles native UI integration. Authoritative
# workspace/runtime state lives in `roost-engine`; reusable presentation
# models live in `roost-ui-model`. The package stays `roost-linux`; only its
# produced binary is named `roost` (`roostctl` is the CLI on PATH).

[lib]
name = "roost_linux"
path = "src/lib.rs"

[[bin]]
name = "roost"
path = "src/main.rs"

[dependencies]
# `BundleProfile` lives in roost-ipc::paths post-M7 (was previously
# re-exported by roost-common, which we just deleted). The Linux UI
# pulls it from there along with the IPC client/server types it
# already used.
roost-ipc    = { path = "../roost-ipc" }
roost-engine = { path = "../roost-engine" }
roost-ui-model = { path = "../roost-ui-model" }
# Phase 7 commit 2: pull in the safe-API wrappers landed in commit 1.
# Linking `--features ffi` brings in libghostty-vt's static archive,
# so the gtk-build CI job now needs the third_party/ghostty/build.sh
# warm-up step (added in this same commit). Local dev: the .a/.dylib
# under third_party/ghostty/out/lib/ must exist before `cargo build -p
# roost-linux`.
roost-vt     = { path = "../roost-vt", features = ["ffi"] }
# Phase 7 commit 2: the OSC scanner moved out of roost-core. Both
# the (now-defunct) daemon and roost-linux consume it from here.
# Mac UI keeps its hand-rolled Swift port (vision DL-5).
roost-osc    = { path = "../roost-osc" }
# PR C: shared URL detection (regex + trim pipeline). Mac UI keeps
# the hand-rolled `UrlDetection.swift` port pinned via the
# `tests/url-fixtures/` corpus.
roost-url    = { path = "../roost-url" }

# State persistence via state.json (M3a): atomic write + reload.
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"

tokio = { workspace = true }
tokio-stream = { workspace = true }
futures = { workspace = true }
anyhow = "1"
thiserror = { workspace = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# gtk4-rs + libadwaita-rs. The `v4_12` feature on gtk4 enables the
# 4.12+ APIs the Phase 7 step plan refers to. libadwaita's `v1_4`
# feature gates the AdwApplicationWindow + AdwHeaderBar combination
# this UI uses.
gtk4 = { version = "0.10", features = ["v4_12"] }
libadwaita = { version = "0.8", features = ["v1_4"] }
glib = "0.21"
# gdk-pixbuf decodes clipboard images (JPEG/GIF/TIFF/WebP) into a
# uniform PNG byte-buffer so we can paste the resulting `.png` path
# to Claude Code / Codex. Already a transitive dep of gtk4-rs; pinned
# here so `use gdk_pixbuf::Pixbuf` resolves directly.
gdk-pixbuf = "0.21"
# Cairo + Pango for the cell renderer.
pangocairo = "0.21"
[dev-dependencies]
tempfile = "3"
