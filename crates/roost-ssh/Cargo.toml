[package]
name        = "roost-ssh"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
description = "In-process SSH dialer (russh) for reaching a host's roost-session over Tailscale SSH"

[lints]
workspace = true

[dependencies]
roost-client = { path = "../roost-client" }
roost-ipc    = { path = "../roost-ipc" }
# `ring`, not the default `aws-lc-rs`: it cross-compiles for Android with
# only the NDK's clang (no CMake, no NASM), and it was the smaller binary in
# the mobile spike. No `rsa` (Tailscale SSH and every current sshd offer an
# ed25519 host key) and no `flate2` (compression buys nothing on a tailnet).
russh   = { version = "0.65", default-features = false, features = ["ring"] }
bytes   = "1"
futures = { workspace = true }
thiserror = { workspace = true }
tokio   = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# The end-to-end lane runs a real session in-process, the way
# roost-session's own integration tests do.
roost-session = { path = "../roost-session" }
roost-engine  = { path = "../roost-engine" }
serde_json    = "1"
tempfile      = "3"
