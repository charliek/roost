[package]
name        = "roost-cli"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
description = "Shell-integration CLI for the Roost UIs (notify, set-title, focus, claude-hook). Talks JSON over a Unix-domain socket directly to the Mac / Linux UI process."

[[bin]]
# `roostctl` is the post-M5 binary name. The previous transitional
# name `roost-cli-rs` survives only in historical commit messages.
name = "roostctl"
path = "src/main.rs"

[dependencies]
roost-ipc   = { path = "../roost-ipc" }
roost-agent = { path = "../roost-agent" }
# `roostctl agent {ensure,install,uninstall,status}`: the only thing in
# this tree that writes into the user's own agent configs.
roost-agent-install = { path = "../roost-agent-install" }
# `agent-hooks` / `agent-hooks-skip`. One parser for the two UIs and the
# CLI beats a second one that can disagree with it, which is worth the
# featureless `roost-vt` this drags in (plan 046 §3.6).
roost-ui-model = { path = "../roost-ui-model" }

tokio   = { workspace = true }
anyhow  = { workspace = true }
clap    = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Used by the `claude-hook` subcommand to parse Claude's JSON payload
# from stdin + by `tab send --bytes-base64` for the base64 decode
# step. `serde` derive is `doctor`'s report shape (there is no
# workspace serde entry; this matches roost-ipc's declaration).
serde      = { version = "1.0", features = ["derive"] }
serde_json = "1"
base64     = "0.22"

# `access(2)`, for "can *this* user execute that file?" when locating the
# roost-session binary. A permission-bit read cannot answer that.
libc       = "0.2"

[lints]
workspace = true
