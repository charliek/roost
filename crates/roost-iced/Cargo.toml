[package]
name        = "roost-iced"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
description = "Roost Iced proof-of-concept UI adapter over roost-engine"

[lints]
workspace = true

# Packaging-only. The Linux .deb builds with this on so the shipped binary
# resolves the production `roost` namespace (socket, state.json, log dir) an
# installed Roost already owns, letting existing users migrate in place. Dev
# builds leave it off and keep the isolated `roost-iced` profile so a dev build
# runs side by side with an installed one.
#
# Never build this crate with `--all-features`: that would hand a dev binary
# the production profile and point it at the user's real state.json.
[features]
linux-package = []

[[bin]]
name = "roost-iced"
path = "src/main.rs"

[dependencies]
# The `Agent` inventory the toast names, and the engine that writes the
# hook entries at startup (plan 046 §3.7). The install crate is all I/O,
# so every call it gets from here goes to the blocking pool.
roost-agent = { path = "../roost-agent" }
roost-agent-install = { path = "../roost-agent-install" }
roost-engine = { path = "../roost-engine" }
roost-ipc = { path = "../roost-ipc" }
roost-ui-model = { path = "../roost-ui-model" }
roost-url = { path = "../roost-url" }
roost-vt = { path = "../roost-vt", features = ["ffi"] }

# Released and exact-pinned for a reproducible long-lived POC. Both renderers
# are compiled: wgpu is primary, tiny-skia is the software/headless fallback.
# `image-without-codecs` rather than `image`: the only raster we draw is the
# embedded app icon in the close-project confirm, and we hand it to iced as
# already-decoded RGBA (the `png` crate below does the decode), so pulling
# `image`'s full codec set in would be dead weight.
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "crisp",
    "image-without-codecs",
    "tiny-skia",
    "tokio",
    "wayland",
    "wgpu",
    "x11",
] }

anyhow = { workspace = true }
# Clipboard image reads only — Iced owns the text clipboard. `image-data`
# hands us raw RGBA (arboard's `image` dep does the decode; the PNG we
# write is encoded with `png` below); `wayland-data-control` lets the
# read work on a Wayland compositor with no window focused.
arboard = { version = "3.6", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }
png = "=0.18.1"
# The machine name this client puts in a host's agent-hooks record, so
# two clients of one host are tellable apart (plan 046 §3.4). Already in
# the workspace's graph (winit's x11rb pulls it), pure Rust, and one
# `uname(2)` behind a safe API — the alternative here is a hand-rolled
# unsafe `libc::gethostname` for the same three lines.
gethostname = "1"
# Trait-only: the host op queue's replies are `serde_json::Value`, and the
# typed decode of one needs `DeserializeOwned` to be nameable. No derives
# live in this crate — the wire types are `roost-ipc`'s.
serde = "1.0"
serde_json = "1"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-width = { workspace = true }

# Main-bundle-identity probe only (`CFBundle::main_bundle().identifier()`),
# not AppKit surface. The version rides the objc2 0.6 generation that
# arboard + softbuffer already pull in (winit still rides objc2 0.5) and
# must move with THAT pair: a bump that shifts objc2-core-foundation's
# major would otherwise resolve a second copy of the crate into the lock.
# `signal(2)` to restore SIGTERM/SIGINT to their default disposition
# before the runtime is torn down (plan 039 § 3.9), and `dlopen`/`dlerror`
# for the macOS Sparkle seam (plan 028 § 3.8). Unix-wide rather than
# macOS-only because the signal restore ships on Linux too. Already in
# the workspace's graph via roost-ipc + roost-engine.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# The Sparkle framework is loaded at runtime from inside the bundle,
# never linked, so no build machinery may depend on it.
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFBundle",
    "CFString",
] }

# The macOS native seam (`src/macos/`, roadmap M6 § 6b — decided by the
# plan-027 spike). Same coupling policy as `objc2-core-foundation` above:
# these ride the objc2 0.6 generation arboard + softbuffer already pull in
# (winit still rides objc2 0.5) and must move with THAT pair — a bump that
# shifts the major would resolve a second copy of the ecosystem into the
# lock. Features are the seam consumers' minimum, not the crates' defaults:
# `objc2-app-kit`'s `default` turns on ~250 of them, so each consumer adds
# only what it names.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    # The category registration's `NSArray`/`NSSet` arguments.
    "NSArray",
    # `localizedDescription` on the errors the UN completion blocks hand back.
    "NSError",
    "NSObject",
    "NSSet",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSApplication",
    # `NSControlStateValue` — the Window menu's active-row checkmark.
    "NSCell",
    "NSDockTile",
    # `NSEventModifierFlags` — menu key-equivalent modifier masks.
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    # `NSApplication`'s superclass; the class item does not exist without it.
    "NSResponder",
] }

# The UNUserNotificationCenter backend (`src/macos/notifications.rs`, plan
# 030 § 3.1). Same coupling policy as the block above — it rides the objc2
# 0.6 / *-0.3 generation. The lockfile ALSO carries an
# `objc2-user-notifications 0.2.2` pulled in transitively by winit →
# objc2-ui-kit: a different major from the older generation, coexisting by
# design. Do not "unify" them.
#
# `UNNotificationSound` is deliberately absent: the content carries no
# sound, only the presentation options do (Swift parity,
# DesktopNotifications.swift:130-136). `block2` is a direct dep because
# the backend spells out the completion-handler block types itself.
block2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    # The `roost-tab` category (no actions) — the Swift app's M8 spike
    # found banner clicks were delivered as plain dismissals until the
    # category was registered (DesktopNotifications.swift:58), so the
    # click -> activation path depends on it. `UNNotificationAction` only
    # because the category constructor's empty `actions` array is typed.
    "UNNotificationAction",
    "UNNotificationCategory",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationResponse",
    # Only so `getNotificationSettingsWithCompletionHandler:` is in scope
    # — the focus-gain refresh reads `authorizationStatus` off it.
    "UNNotificationSettings",
    # Only so `requestWithIdentifier:content:trigger:` is in scope — the
    # trigger passed is always nil (deliver now).
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }

# Linux desktop notifications speak the freedesktop Desktop Notifications
# spec (`org.freedesktop.Notifications` over the session bus) — GNOME,
# KDE, COSMIC, and everyone else that implements the spec. Direct zbus
# rather than notify-rust: we need one connection for Notify +
# ActionInvoked, and a single MessageStream (notify-rust 4.18 rebuilds
# the stream on every ignored signal, which drops spec 1.2
# `ActivationToken` → `ActionInvoked` pairs). `tokio` keeps zbus on the
# app runtime.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
swash = "=0.2.10"
tempfile = "3"
# `start_paused` only. One case has to let the reconnect timer actually
# fire so it reads the staleness stamp off the wire rather than
# recomputing it, and a suite that sleeps for a jittered backoff is a
# suite that flakes.
tokio = { workspace = true, features = ["test-util"] }
