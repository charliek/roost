[package]
name        = "roost-iced"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
publish.workspace      = true
description = "Roost Iced proof-of-concept UI adapter over roost-engine"

[lints]
workspace = true

# Packaging-only. The Linux .deb builds with this on so the shipped binary
# resolves the production `roost` namespace (socket, state.json, log dir) that
# the GTK package already owns, letting existing users migrate in place. Dev
# builds leave it off and keep the isolated `roost-iced` profile so both UIs
# run side by side.
#
# Never build this crate with `--all-features`: that would hand a dev binary
# the production profile and point it at the user's real state.json.
[features]
linux-package = []

[[bin]]
name = "roost-iced"
path = "src/main.rs"

[dependencies]
roost-engine = { path = "../roost-engine" }
roost-ipc = { path = "../roost-ipc" }
roost-ui-model = { path = "../roost-ui-model" }
roost-url = { path = "../roost-url" }
roost-vt = { path = "../roost-vt", features = ["ffi"] }

# Released and exact-pinned for a reproducible long-lived POC. Both renderers
# are compiled: wgpu is primary, tiny-skia is the software/headless fallback.
# `image-without-codecs` rather than `image`: the only raster we draw is the
# embedded app icon in the close-project confirm, and we hand it to iced as
# already-decoded RGBA (the `png` crate below does the decode), so pulling
# `image`'s full codec set in would be dead weight.
iced = { version = "=0.14.0", default-features = false, features = [
    "advanced",
    "crisp",
    "image-without-codecs",
    "tiny-skia",
    "tokio",
    "wayland",
    "wgpu",
    "x11",
] }

anyhow = { workspace = true }
# Clipboard image reads only — Iced owns the text clipboard. `image-data`
# hands us raw RGBA (arboard's `image` dep does the decode; the PNG we
# write is encoded with `png` below); `wayland-data-control` lets the
# read work on a Wayland compositor with no window focused.
arboard = { version = "3.6", default-features = false, features = [
    "image-data",
    "wayland-data-control",
] }
png = "=0.18.1"
serde_json = "1"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
unicode-width = { workspace = true }

# Main-bundle-identity probe only (`CFBundle::main_bundle().identifier()`),
# not AppKit surface. The version rides the objc2 0.6 generation that
# arboard + softbuffer already pull in (winit still rides objc2 0.5) and
# must move with THAT pair: a bump that shifts objc2-core-foundation's
# major would otherwise resolve a second copy of the crate into the lock.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "CFBundle",
    "CFString",
] }

# The desktop-notification backend is per-OS: this one talks
# `org.freedesktop.Notifications` over D-Bus. `z-with-tokio` keeps zbus on
# the app's tokio runtime instead of pulling in async-io/smol.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { version = "4.11", default-features = false, features = [
    "z-with-tokio",
] }

[dev-dependencies]
swash = "=0.2.10"
tempfile = "3"
