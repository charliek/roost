# nfpm config for the Roost Linux .deb.
#
# Built by linux/scripts/build-deb.sh, which stages the binaries into ./dist/
# and sets ROOST_VERSION + ROOST_ARCH. nfpm expands ${ENV} in this file at
# package time. Paths are relative to the repo root (build-deb.sh runs there).
#
# Output: roost_${ROOST_VERSION}_${ROOST_ARCH}.deb  (matches apt-charliek glob
# "roost_*.deb").
name: roost
arch: ${ROOST_ARCH}
version: ${ROOST_VERSION}
platform: linux
section: utils
priority: optional
maintainer: Charlie Knudsen <charlie.knudsen@gmail.com>
vendor: Stride Labs
homepage: https://github.com/charliek/roost
license: MIT
description: |
  Multi-project terminal multiplexer for AI coding agents.
  Roost is a cross-platform desktop terminal multiplexer built around
  libghostty-vt: a sidebar of projects, tabs per project, one terminal per tab,
  with notification routing for AI coding agents (Claude Code, Codex). Ships the
  iced UI (roost) plus the roostctl CLI for shell + hook integration.

# DO NOT derive this list from `ldd`/`readelf -d`. winit, wgpu and ash
# `dlopen` the entire graphics + input stack, so the binary's real NEEDED set
# is only libc.so.6 / libgcc_s.so.1 / libm.so.6 — a linkage-derived list would
# be two entries, install cleanly everywhere, and then fail to launch on any
# machine that didn't already happen to have the stack.
#
# The list below is what an `strace -f -e trace=openat` of a real launch
# actually opened, mapped through `dpkg -S` and reduced to the libraries the
# application itself loads (their own Depends pull the rest of the closure —
# Mesa alone accounts for ~30 more packages that must NOT be pinned here).
#
# Measured over SEVEN of the eight cells of {Wayland, X11} x {Vulkan ICD,
# none} x {libEGL reachable, not} (#325). The first two axes exist because a
# single measurement is systematically blind: the original list was taken
# under Xvfb only, and X11 never needs `libwayland-egl`. The third axis exists
# because with neither a Vulkan ICD nor libEGL, wgpu enumerates zero adapters
# and iced quietly renders on the CPU via tiny-skia — so the whole GLES path,
# and every library it loads, stays untouched and unmeasured.
depends:
  # Measured, not inherited: `objdump -T` on the release binary shows
  # non-weak GLIBC_2.35 imports (hypot/hypotf) and GLIBC_2.34 (pthread_*,
  # __libc_start_main). The 2.39 symbols it also references are weak, so
  # they do not raise the floor. The old `>= 2.31` carried over from the GTK
  # package would let this install on Ubuntu 20.04 / Debian 11 and then fail
  # in the dynamic loader before a window ever appears — the same
  # install-clean-then-fail shape the dlopen note below is about.
  - libc6 (>= 2.35)
  - libgcc-s1
  # A terminal with no monospace glyphs is not usable. Startup itself does
  # survive a font-less system (measured: a --no-install-recommends install
  # into a container with zero files under /usr/share/fonts and no
  # fontconfig still opened a window), so this is about being legible, not
  # about booting.
  - fonts-dejavu-core
  # winit: keyboard mapping, and the X11/Wayland client libraries.
  - libxkbcommon0
  - libxkbcommon-x11-0
  - libwayland-client0
  - libx11-6
  - libx11-xcb1
  - libxcb1
  - libxcursor1
  - libxi6
  # wgpu's GLES backend, reached whenever no Vulkan ICD is usable — which both
  # `--no-install-recommends` and any GPU without an ICD produce. `libegl1` is
  # the vendor-neutral loader the app dlopens by soname; `libwayland-egl1`
  # supplies the `wl_egl_window_create` the same backend needs to build a
  # surface on a Wayland compositor.
  #
  # These two travel TOGETHER. Measured: with libEGL present and
  # libwayland-egl1 absent, roost does not degrade — it SIGABRTs (exit 134)
  # inside `Surface::configure`, because iced's tiny-skia fallback covers
  # compositor *creation* and not surface configure. Adding `libegl1` alone
  # would therefore create that crash rather than prevent it.
  - libegl1
  - libwayland-egl1
# Vulkan is deliberately NOT a hard dependency. Measured: with
# /usr/share/vulkan/icd.d removed entirely the app still opens a window —
# wgpu falls back to the software renderer that is compiled in alongside it.
# Recommends is installed by default for ordinary `apt install`, so users get
# GPU acceleration; only `--no-install-recommends` (containers, CI) drops to
# software, which works.
recommends:
  - fonts-noto-color-emoji
  - libvulkan1
  - mesa-vulkan-drivers

contents:
  - src: ./dist/roost
    dst: /usr/bin/roost
  - src: ./dist/roostctl
    dst: /usr/bin/roostctl
  # roost-session lands beside roostctl on purpose: `roostctl session
  # start` looks for a sibling before it looks at $PATH.
  - src: ./dist/roost-session
    dst: /usr/bin/roost-session
  - src: ./packaging/roost.desktop
    dst: /usr/share/applications/ai.stridelabs.Roost.desktop
  # roost-gtk-alias.desktop: NoDisplay compat shim so v0.0.17-era launcher
  # pins to ai.stridelabs.Roost.gtk.desktop keep resolving. Delete once no
  # installed launcher pin references it; revisit at v0.1.0 (plan 031).
  - src: ./packaging/roost-gtk-alias.desktop
    dst: /usr/share/applications/ai.stridelabs.Roost.gtk.desktop
  - src: ./packaging/icons/hicolor/256x256/apps/roost.png
    dst: /usr/share/icons/hicolor/256x256/apps/roost.png
  - src: ./packaging/icons/hicolor/512x512/apps/roost.png
    dst: /usr/share/icons/hicolor/512x512/apps/roost.png
  - src: ./packaging/copyright
    dst: /usr/share/doc/roost/copyright
  - src: ./README.md
    dst: /usr/share/doc/roost/README.md
