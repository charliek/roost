# Deploys the PNGs scripts/generate_app_icons.py renders into the platform icon
# slots. Regenerate both with `make mobile-icons`.
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"

  android: true
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_monochrome: "assets/icon/app_icon_foreground.png"

  macos:
    generate: true
    image_path: "assets/icon/app_icon_desktop.png"

  ios: false
  web:
    generate: false
  windows:
    generate: false
  linux:
    generate: false
